name: ORES middleware canonical Gleam format probe
on:
  push:
    branches: [test/ores-middleware-format-14ef9c9]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-middleware
          ref: 14ef9c96f2e95e1ce2f048b1a1a7dde95e7b9f9a
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.3.4.14"
          gleam-version: "1.18.1"
          rebar3-version: "3.24.0"
      - run: |
          cd src/gleam
          gleam format src test
          git diff -- src/gleam
